<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <rect width="800" height="240" fill="#0f172a" rx="12"/>
  <text x="400" y="36" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">KOMPOSISI STRUKTUR KONTROL (LOOP DALAM BRANCH &amp; SEBALIKNYA)</text>

  <g transform="translate(60, 65)">
    <rect width="320" height="145" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="8"/>
    <text x="160" y="25" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Pola A: Percabangan di dalam Loop</text>
    <rect x="20" y="38" width="280" height="95" fill="#0f172a" rx="6"/>
    <text x="35" y="60" fill="#e2e8f0" font-family="monospace" font-size="11">for i := 1; i &lt;= n; i++ {</text>
    <text x="50" y="80" fill="#fbbf24" font-family="monospace" font-size="11">if i % 2 == 0 { // genap</text>
    <text x="65" y="100" fill="#34d399" font-family="monospace" font-size="11">fmt.Println(i, "Genap")</text>
    <text x="50" y="118" fill="#fbbf24" font-family="monospace" font-size="11">}</text>
    <text x="35" y="128" fill="#e2e8f0" font-family="monospace" font-size="11">}</text>
  </g>

  <g transform="translate(420, 65)">
    <rect width="320" height="145" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" rx="8"/>
    <text x="160" y="25" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Pola B: Perulangan di dalam Percabangan</text>
    <rect x="20" y="38" width="280" height="95" fill="#0f172a" rx="6"/>
    <text x="35" y="60" fill="#fbbf24" font-family="monospace" font-size="11">if menu == "CETAK" {</text>
    <text x="50" y="80" fill="#38bdf8" font-family="monospace" font-size="11">for k := 0; k &lt; jumlah; k++ {</text>
    <text x="65" y="100" fill="#34d399" font-family="monospace" font-size="11">fmt.Print("# ")</text>
    <text x="50" y="118" fill="#38bdf8" font-family="monospace" font-size="11">}</text>
    <text x="35" y="128" fill="#fbbf24" font-family="monospace" font-size="11">}</text>
  </g>
</svg>