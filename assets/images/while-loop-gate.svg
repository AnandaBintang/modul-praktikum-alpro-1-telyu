<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <rect width="800" height="240" fill="#0f172a" rx="12"/>
  <text x="400" y="36" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">WHILE-LOOP PATTERN DI GOLANG (CEK GERBANG DI AWAL)</text>

  <g transform="translate(60, 95)">
    <circle cx="20" cy="20" r="18" fill="#38bdf8"/>
    <text x="20" y="25" fill="#0f172a" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Start</text>
    <line x1="45" y1="20" x2="100" y2="20" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <g transform="translate(180, 70)">
    <polygon points="70,0 140,45 70,90 0,45" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="70" y="42" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">kondisi?</text>
    <text x="70" y="58" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Cek di Depan</text>
  </g>

  <g transform="translate(380, 75)">
    <rect width="200" height="80" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="8"/>
    <text x="100" y="35" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Badan Perulangan</text>
    <text x="100" y="58" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Aksi &amp; Update Variabel</text>
  </g>

  <!-- Loop back arrow -->
  <path d="M 480 75 L 480 40 L 250 40 L 250 65" fill="none" stroke="#10b981" stroke-width="2"/>
  <text x="365" y="32" fill="#10b981" font-family="sans-serif" font-size="11" text-anchor="middle">Ulangi selama TRUE</text>

  <!-- Exit False arrow -->
  <g transform="translate(630, 95)">
    <line x1="-40" y1="20" x2="20" y2="20" stroke="#ef4444" stroke-width="2"/>
    <text x="-10" y="10" fill="#f87171" font-family="sans-serif" font-size="11">FALSE</text>
    <rect x="25" y="0" width="100" height="40" fill="#1e293b" stroke="#64748b" rx="6"/>
    <text x="75" y="25" fill="#cbd5e1" font-family="sans-serif" font-size="12" text-anchor="middle">Selesai</text>
  </g>
</svg>