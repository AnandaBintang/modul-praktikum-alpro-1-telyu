<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <rect width="800" height="240" fill="#0f172a" rx="12"/>
  <text x="400" y="36" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">ANALOGI VARIABEL DAN ALAMAT MEMORI DI RAM</text>
  
  <g transform="translate(80, 65)">
    <!-- Variable Box -->
    <rect width="260" height="140" fill="#1e293b" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4" rx="10"/>
    <rect x="20" y="-14" width="130" height="28" fill="#0284c7" rx="6"/>
    <text x="85" y="5" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Nama: skor</text>
    
    <text x="130" y="45" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Tipe Data: int</text>
    
    <rect x="40" y="60" width="180" height="55" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="130" y="95" fill="#f8fafc" font-family="monospace" font-size="24" font-weight="bold" text-anchor="middle">100</text>
    <text x="130" y="130" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">Nilai Data (Value)</text>
  </g>

  <!-- Pointer Reference -->
  <g transform="translate(420, 65)">
    <rect width="300" height="140" fill="#1e293b" stroke="#a855f7" stroke-width="2" rx="10"/>
    <text x="150" y="30" fill="#a855f7" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Operasi Akses Data</text>
    
    <rect x="20" y="48" width="260" height="35" fill="#0f172a" rx="6"/>
    <text x="35" y="70" fill="#38bdf8" font-family="monospace" font-size="13">skor</text>
    <text x="120" y="70" fill="#e2e8f0" font-family="sans-serif" font-size="12">-> Mengambil nilai: 100</text>
    
    <rect x="20" y="92" width="260" height="35" fill="#0f172a" rx="6"/>
    <text x="35" y="114" fill="#c084fc" font-family="monospace" font-size="13">&amp;skor</text>
    <text x="120" y="114" fill="#e2e8f0" font-family="sans-serif" font-size="12">-> Alamat RAM: 0xc00001</text>
  </g>
</svg>