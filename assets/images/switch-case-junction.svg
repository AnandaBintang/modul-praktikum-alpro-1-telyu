<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <rect width="800" height="240" fill="#0f172a" rx="12"/>
  <text x="400" y="36" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">SWITCH-CASE SEBAGAI MULTI-CHANNEL SELECTOR</text>

  <g transform="translate(60, 80)">
    <rect width="180" height="80" fill="#1e293b" stroke="#a855f7" stroke-width="2" rx="8"/>
    <text x="90" y="35" fill="#c084fc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">switch pilihan</text>
    <text x="90" y="60" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Cocokkan nilai pasti</text>
  </g>

  <g transform="translate(320, 50)">
    <rect x="0" y="0" width="180" height="32" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="90" y="21" fill="#38bdf8" font-family="monospace" font-size="12" text-anchor="middle">case 1: Menu Soto</text>

    <rect x="0" y="42" width="180" height="32" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="90" y="63" fill="#38bdf8" font-family="monospace" font-size="12" text-anchor="middle">case 2: Menu Rawon</text>

    <rect x="0" y="84" width="180" height="32" fill="#1e293b" stroke="#38bdf8" rx="4"/>
    <text x="90" y="105" fill="#38bdf8" font-family="monospace" font-size="12" text-anchor="middle">case 3: Menu Bakso</text>

    <rect x="0" y="126" width="180" height="32" fill="#1e293b" stroke="#64748b" rx="4"/>
    <text x="90" y="147" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">default: Tidak Ada</text>
  </g>

  <g transform="translate(560, 75)">
    <rect width="180" height="90" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="8"/>
    <text x="90" y="30" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Karakteristik Go:</text>
    <text x="90" y="52" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">- Otomatis break</text>
    <text x="90" y="72" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">- Tidak tembus ke bawah</text>
  </g>
</svg>