<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <rect width="800" height="240" fill="#0f172a" rx="12"/>
  <text x="400" y="36" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">ANATOMI PERULANGAN FOR (COUNTER BASED)</text>

  <g transform="translate(50, 70)">
    <rect width="180" height="120" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="8"/>
    <text x="90" y="30" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. Inisialisasi</text>
    <rect x="20" y="45" width="140" height="35" fill="#0f172a" rx="4"/>
    <text x="90" y="68" fill="#f8fafc" font-family="monospace" font-size="14" text-anchor="middle">i := 1</text>
    <text x="90" y="100" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Dijalankan 1x diawal</text>
  </g>

  <g transform="translate(250, 70)">
    <rect width="180" height="120" fill="#1e293b" stroke="#f59e0b" stroke-width="2" rx="8"/>
    <text x="90" y="30" fill="#f59e0b" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2. Evaluasi Kondisi</text>
    <rect x="20" y="45" width="140" height="35" fill="#0f172a" rx="4"/>
    <text x="90" y="68" fill="#f8fafc" font-family="monospace" font-size="14" text-anchor="middle">i &lt;= 5</text>
    <text x="90" y="100" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Jika true: lanjut body</text>
  </g>

  <g transform="translate(450, 70)">
    <rect width="150" height="120" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="8"/>
    <text x="75" y="30" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">3. Loop Body</text>
    <rect x="15" y="45" width="120" height="35" fill="#0f172a" rx="4"/>
    <text x="75" y="68" fill="#f8fafc" font-family="monospace" font-size="13" text-anchor="middle">Aksi Kerja</text>
    <text x="75" y="100" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Cetak / Hitung</text>
  </g>

  <g transform="translate(620, 70)">
    <rect width="130" height="120" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" rx="8"/>
    <text x="65" y="30" fill="#8b5cf6" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">4. Step</text>
    <rect x="15" y="45" width="100" height="35" fill="#0f172a" rx="4"/>
    <text x="65" y="68" fill="#f8fafc" font-family="monospace" font-size="14" text-anchor="middle">i++</text>
    <text x="65" y="100" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Naikkan counter</text>
  </g>
</svg>