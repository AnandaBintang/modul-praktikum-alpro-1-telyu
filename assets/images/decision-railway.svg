<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <rect width="800" height="240" fill="#0f172a" rx="12"/>
  <text x="400" y="36" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">ANALOGI PERCABANGAN WESEL REL KERETA (IF - ELSE)</text>

  <g transform="translate(60, 100)">
    <rect x="0" y="0" width="120" height="40" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="6"/>
    <text x="60" y="25" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Input Data</text>
  </g>

  <g transform="translate(240, 75)">
    <polygon points="65,0 130,45 65,90 0,45" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="65" y="42" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Evaluasi</text>
    <text x="65" y="58" fill="#fbbf24" font-family="sans-serif" font-size="11" text-anchor="middle">Kondisi ?</text>
  </g>

  <!-- True Branch -->
  <g transform="translate(440, 50)">
    <line x1="-70" y1="70" x2="0" y2="20" stroke="#10b981" stroke-width="3"/>
    <text x="-40" y="35" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">TRUE</text>
    <rect x="0" y="0" width="280" height="40" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="140" y="25" fill="#34d399" font-family="monospace" font-size="13" text-anchor="middle">Blok Aksi IF Dijalankan</text>
  </g>

  <!-- False Branch -->
  <g transform="translate(440, 150)">
    <line x1="-70" y1="-30" x2="0" y2="20" stroke="#ef4444" stroke-width="3"/>
    <text x="-45" y="0" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="bold">FALSE</text>
    <rect x="0" y="0" width="280" height="40" fill="#1e293b" stroke="#ef4444" stroke-width="2" rx="6"/>
    <text x="140" y="25" fill="#f87171" font-family="monospace" font-size="13" text-anchor="middle">Blok ELSE / Lewati Eksekusi</text>
  </g>
</svg>