<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <rect width="800" height="240" fill="#0f172a" rx="12"/>
  <text x="400" y="36" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">SKEMA PEMROSESAN SEKUENSIAL DENGAN MARKER / SENTINEL</text>

  <g transform="translate(60, 75)">
    <text x="0" y="20" fill="#94a3b8" font-family="sans-serif" font-size="13">Rangkaian Pita Data Masukan (Stream):</text>
    
    <g transform="translate(0, 35)">
      <rect x="0" y="0" width="70" height="45" fill="#1e293b" stroke="#38bdf8" rx="6"/>
      <text x="35" y="28" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">12</text>
      
      <rect x="80" y="0" width="70" height="45" fill="#1e293b" stroke="#38bdf8" rx="6"/>
      <text x="115" y="28" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">45</text>
      
      <rect x="160" y="0" width="70" height="45" fill="#1e293b" stroke="#38bdf8" rx="6"/>
      <text x="195" y="28" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">78</text>

      <rect x="240" y="0" width="70" height="45" fill="#1e293b" stroke="#38bdf8" rx="6"/>
      <text x="275" y="28" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">33</text>

      <rect x="320" y="0" width="90" height="45" fill="#7f1d1d" stroke="#ef4444" stroke-width="2" rx="6"/>
      <text x="365" y="28" fill="#fca5a5" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">-999</text>
      
      <text x="365" y="65" fill="#f87171" font-family="sans-serif" font-size="11" text-anchor="middle">MARKER</text>
    </g>
  </g>

  <g transform="translate(510, 75)">
    <rect width="230" height="115" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="8"/>
    <text x="115" y="30" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Logika Pembacaan:</text>
    <text x="25" y="55" fill="#e2e8f0" font-family="sans-serif" font-size="11">1. Baca data awal (first item)</text>
    <text x="25" y="75" fill="#e2e8f0" font-family="sans-serif" font-size="11">2. Loop selama data != MARKER</text>
    <text x="25" y="95" fill="#e2e8f0" font-family="sans-serif" font-size="11">3. Proses &amp; baca elemen berikut</text>
  </g>
</svg>