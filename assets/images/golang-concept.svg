<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <rect width="800" height="240" fill="#0f172a" rx="12"/>
  <text x="400" y="36" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="18" font-weight="bold" text-anchor="middle">ALUR KOMPILASI DAN EKSEKUSI PROGRAM GO</text>
  
  <!-- Step 1 -->
  <g transform="translate(40, 60)">
    <rect width="180" height="130" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="8"/>
    <text x="90" y="32" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Kode Sumber</text>
    <rect x="25" y="48" width="130" height="60" fill="#0f172a" rx="4"/>
    <text x="35" y="72" fill="#94a3b8" font-family="monospace" font-size="12">main.go</text>
    <text x="35" y="92" fill="#e2e8f0" font-family="monospace" font-size="11">package main</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(235, 115)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="25" y="-12" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">go build</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(300, 60)">
    <rect width="180" height="130" fill="#1e293b" stroke="#818cf8" stroke-width="2" rx="8"/>
    <text x="90" y="32" fill="#818cf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Compiler Go</text>
    <text x="90" y="65" fill="#cbd5e1" font-family="sans-serif" font-size="12" text-anchor="middle">Type Checking</text>
    <text x="90" y="85" fill="#cbd5e1" font-family="sans-serif" font-size="12" text-anchor="middle">Syntax Validation</text>
    <text x="90" y="105" fill="#cbd5e1" font-family="sans-serif" font-size="12" text-anchor="middle">Machine Optimization</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(495, 115)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#818cf8" stroke-width="3"/>
    <text x="25" y="-12" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">biner</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(560, 60)">
    <rect width="200" height="130" fill="#1e293b" stroke="#34d399" stroke-width="2" rx="8"/>
    <text x="100" y="32" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Binary Executable</text>
    <rect x="25" y="48" width="150" height="60" fill="#0f172a" rx="4"/>
    <text x="100" y="75" fill="#34d399" font-family="monospace" font-size="12" text-anchor="middle">./main (Linux/Mac)</text>
    <text x="100" y="95" fill="#34d399" font-family="monospace" font-size="12" text-anchor="middle">main.exe (Windows)</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>
</svg>