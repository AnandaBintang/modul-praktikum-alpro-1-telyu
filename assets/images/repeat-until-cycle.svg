<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <rect width="800" height="240" fill="#0f172a" rx="12"/>
  <text x="400" y="36" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">REPEAT-UNTIL PATTERN (EKSEKUSI MINIMAL 1 KALI)</text>

  <g transform="translate(80, 85)">
    <rect width="220" height="70" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="8"/>
    <text x="110" y="30" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. Kerjakan Aksi Dulu</text>
    <text x="110" y="52" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">(Scan input / proses data)</text>
  </g>

  <g transform="translate(370, 70)">
    <polygon points="65,0 130,50 65,100 0,50" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="65" y="45" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Kondisi</text>
    <text x="65" y="62" fill="#fbbf24" font-family="sans-serif" font-size="11" text-anchor="middle">Berhenti?</text>
  </g>

  <g transform="translate(560, 85)">
    <rect width="180" height="70" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="8"/>
    <text x="90" y="30" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Selesai (Stop)</text>
    <text x="90" y="52" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Jika kondisi terpenuhi</text>
  </g>

  <!-- Loop back if false -->
  <path d="M 435 170 L 435 195 L 190 195 L 190 160" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="312" y="210" fill="#f87171" font-family="sans-serif" font-size="11" text-anchor="middle">Ulangi lagi jika belum selesai</text>
</svg>