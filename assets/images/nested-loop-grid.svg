<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <rect width="800" height="240" fill="#0f172a" rx="12"/>
  <text x="400" y="36" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">PERULANGAN BERSARANG (NESTED LOOP) SEBAGAI MATRIKS BARIS &amp; KOLOM</text>

  <g transform="translate(60, 65)">
    <rect width="320" height="145" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="8"/>
    <text x="20" y="30" fill="#38bdf8" font-family="monospace" font-size="13">for i := 1; i &lt;= baris; i++ {</text>
    <text x="40" y="55" fill="#a855f7" font-family="monospace" font-size="13">for j := 1; j &lt;= kolom; j++ {</text>
    <text x="60" y="80" fill="#10b981" font-family="monospace" font-size="13">fmt.Print("* ")</text>
    <text x="40" y="105" fill="#a855f7" font-family="monospace" font-size="13">}</text>
    <text x="40" y="125" fill="#38bdf8" font-family="monospace" font-size="13">fmt.Println() // ganti baris</text>
    <text x="20" y="140" fill="#38bdf8" font-family="monospace" font-size="13">}</text>
  </g>

  <g transform="translate(430, 65)">
    <rect width="310" height="145" fill="#1e293b" stroke="#64748b" stroke-width="1.5" rx="8"/>
    <text x="155" y="25" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Visualisasi Grid 3 x 4</text>
    
    <g transform="translate(45, 45)">
      <rect x="0" y="0" width="50" height="22" fill="#0f172a" stroke="#38bdf8" rx="3"/><text x="25" y="15" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">1, 1</text>
      <rect x="55" y="0" width="50" height="22" fill="#0f172a" stroke="#38bdf8" rx="3"/><text x="80" y="15" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">1, 2</text>
      <rect x="110" y="0" width="50" height="22" fill="#0f172a" stroke="#38bdf8" rx="3"/><text x="135" y="15" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">1, 3</text>
      <rect x="165" y="0" width="50" height="22" fill="#0f172a" stroke="#38bdf8" rx="3"/><text x="190" y="15" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">1, 4</text>

      <rect x="0" y="28" width="50" height="22" fill="#0f172a" stroke="#a855f7" rx="3"/><text x="25" y="43" fill="#a855f7" font-family="monospace" font-size="11" text-anchor="middle">2, 1</text>
      <rect x="55" y="28" width="50" height="22" fill="#0f172a" stroke="#a855f7" rx="3"/><text x="80" y="43" fill="#a855f7" font-family="monospace" font-size="11" text-anchor="middle">2, 2</text>
      <rect x="110" y="28" width="50" height="22" fill="#0f172a" stroke="#a855f7" rx="3"/><text x="135" y="43" fill="#a855f7" font-family="monospace" font-size="11" text-anchor="middle">2, 3</text>
      <rect x="165" y="28" width="50" height="22" fill="#0f172a" stroke="#a855f7" rx="3"/><text x="190" y="43" fill="#a855f7" font-family="monospace" font-size="11" text-anchor="middle">2, 4</text>

      <rect x="0" y="56" width="50" height="22" fill="#0f172a" stroke="#10b981" rx="3"/><text x="25" y="71" fill="#10b981" font-family="monospace" font-size="11" text-anchor="middle">3, 1</text>
      <rect x="55" y="56" width="50" height="22" fill="#0f172a" stroke="#10b981" rx="3"/><text x="80" y="71" fill="#10b981" font-family="monospace" font-size="11" text-anchor="middle">3, 2</text>
      <rect x="110" y="56" width="50" height="22" fill="#0f172a" stroke="#10b981" rx="3"/><text x="135" y="71" fill="#10b981" font-family="monospace" font-size="11" text-anchor="middle">3, 3</text>
      <rect x="165" y="56" width="50" height="22" fill="#0f172a" stroke="#10b981" rx="3"/><text x="190" y="71" fill="#10b981" font-family="monospace" font-size="11" text-anchor="middle">3, 4</text>
    </g>
  </g>
